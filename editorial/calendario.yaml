# Calendario editorial de España en datos hasta después de las generales del 29 de noviembre de 2026.
#
# Ritmo: lunes NOTA (1-2 gráficos, una mirada) y miércoles y viernes ARTÍCULO (tema nuevo con las tres miradas).
# Lo publica la rutina «espana-publicacion» siguiendo editorial/MANUAL.md: toma la primera entrada con
# estado: pendiente cuya fecha sea hoy o anterior, la publica y la marca como hecha.
#
# Gancho: las elecciones. Cada pieza explica por qué el tema importa el 29N y enlaza al especial.
# Fechas especiales:
#   - 13 nov: empieza la campaña.
#   - 24-28 nov: VEDA de encuestas (LOREG art. 69.7). Ninguna pieza puede mostrar ni citar encuestas de voto.
#   - 28 nov (sábado): jornada de reflexión. No hay pieza ese día.
#   - 29 nov: elecciones.
#
# tipo: nota | articulo
# tema: id del tema (web/src/content/themes/<id>.ts). Si no existe, el artículo lo crea; una nota debe ir a un tema publicado.
# estado: hecha | pendiente

piezas:
  - id: vi
    tipo: articulo
    fecha: 2026-10-06
    tema: vivienda
    titulo: "Vivienda: por qué es el tema de estas elecciones"
    estado: hecha

  - id: a01
    tipo: articulo
    fecha: 2026-10-07
    tema: legislatura
    titulo: "La legislatura en datos: cómo ha cambiado España desde julio de 2023"
    estado: hecha
    idea: empleo, paro, inflación, salarios reales, deuda y déficit públicos, comparados con la UE y por comunidades. Balance descriptivo, sin atribuir mérito o culpa.

  - id: a02
    tipo: articulo
    fecha: 2026-10-09
    tema: empleo
    titulo: "Empleo: la reforma laboral, tres años después"
    idea: temporalidad y contratos indefinidos (EPA, afiliación), paro juvenil y de larga duración. Ficha de política de la reforma laboral de 2022 con su grupo de comparación y evaluaciones independientes (Banco de España, AIReF, académicas).
    estado: hecha

  - id: n01
    tipo: nota
    fecha: 2026-10-12
    tema: elecciones
    mirada: dentro
    titulo: "Quién gobierna dónde y qué se juega cada comunidad el 29N"
    idea: mapa de gobiernos autonómicos (dataset gobiernos) y escaños de cada comunidad en 2026.

  - id: a03
    tipo: articulo
    fecha: 2026-10-14
    tema: demografia
    titulo: "Demografía y pensiones: un país que envejece"
    idea: natalidad, esperanza de vida, población por edades, gasto en pensiones frente a la UE, tasa de dependencia por comunidades.

  - id: a04
    tipo: articulo
    fecha: 2026-10-16
    tema: inmigracion
    titulo: "Inmigración en datos"
    idea: población extranjera y nacida fuera, empleo y afiliación, comparación europea. Solo fuentes oficiales (INE, Eurostat, Seguridad Social, Interior). Máxima prudencia: nada de relacionar inmigración con delincuencia sin datos oficiales comparables.

  - id: n02
    tipo: nota
    fecha: 2026-10-19
    tema: empleo
    mirada: tiempo
    titulo: "Salarios reales y salario mínimo"
    idea: salario medio descontada la inflación y evolución del SMI.

  - id: a05
    tipo: articulo
    fecha: 2026-10-21
    tema: autonomias
    titulo: "Financiación autonómica y deuda de las comunidades"
    idea: deuda por comunidad (Banco de España), financiación por habitante ajustado (Hacienda, Fedea), gasto por habitante.

  - id: a06
    tipo: articulo
    fecha: 2026-10-23
    tema: sanidad
    titulo: "Sanidad: listas de espera y gasto por comunidad"
    idea: listas de espera (Ministerio de Sanidad, SISLE), gasto sanitario público por habitante, médicos por habitante frente a la UE.

  - id: n03
    tipo: nota
    fecha: 2026-10-26
    tema: elecciones
    mirada: tiempo
